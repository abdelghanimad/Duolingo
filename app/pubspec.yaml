name: global_guess_live
description: "Global Guess Live — a two-player live voice guessing game for language learners."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Pure-Dart domain layer (models, utils, win-detection).
  global_guess_live_core:
    path: ../core
  # Backend
  supabase_flutter: ^2.5.0
  # Real-time voice (P2P)
  flutter_webrtc: ^0.11.0
  # On-device speech recognition
  speech_to_text: ^6.6.0
  # State management
  flutter_riverpod: ^2.5.1
  # Utilities
  uuid: ^4.4.0
  collection: ^1.18.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  test: ^1.25.0

flutter:
  uses-material-design: true
  assets:
    - assets/puzzles/
